name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilar
        run: mvn -B clean package

      - name: Comprobar que el jar tiene clases
        run: unzip -l target/friends-*.jar | grep -E "\.class|velocity-plugin.json"

      - uses: actions/upload-artifact@v4
        with:
          name: friends
          path: target/friends-*.jar
